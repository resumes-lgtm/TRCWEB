name: Extract website files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'theresumechic-site.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for ZIP
        id: zipcheck
        run: |
          if [ -f theresumechic-site.zip ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "The website ZIP has already been extracted. Nothing to do."
          fi

      - name: Extract website into repository root
        if: steps.zipcheck.outputs.exists == 'true'
        run: |
          rm -rf .site-extract
          mkdir .site-extract
          unzip -q theresumechic-site.zip -d .site-extract
          if [ -d .site-extract/theresumechic-site ]; then
            cp -R .site-extract/theresumechic-site/. .
          else
            cp -R .site-extract/. .
          fi
          rm -rf .site-extract
          rm -f theresumechic-site.zip
          touch .nojekyll

      - name: Commit extracted website
        if: steps.zipcheck.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract website files for GitHub Pages"
            git push
          fi
